<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}FastAPI HTMX{% endblock %}</title>
    <link href="/static/css/app.css" rel="stylesheet" />
    <script src="/static/vendor/flowbite/flowbite.min.js"></script>
    <script src="/static/vendor/htmx/htmx.min.js"></script>
    <script src="/static/js/shell.js"></script>
    <script defer src="/static/vendor/alpinejs/alpine.min.js"></script>
    {% block additional_head %}{% endblock %}
  </head>

  <body class="bg-neutral-primary text-body">
    {% block shell %}
    {% include "partials/shell/navbar.html" %}
    {% include "partials/shell/sidebar.html" %}
    {% block content %}{% endblock %}
    {% endblock %}

    <script src="/static/js/components.js"></script>
    <script src="/static/js/upload.js"></script>
    <script src="/static/vendor/hyperscript/hyperscript.min.js"></script>

    {% block additional_scripts %}{% endblock %}
  </body>
</html>
