<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Your Page Title{% endblock %}</title>
    <!-- Add any other head elements here -->

    <!-- Include the CSS for Flowbite -->
    <link
      href="/static/vendor/flowbite/flowbite-1.8.1.min.css"
      rel="stylesheet"
    />
    <!-- Include the Flowbite JavaScript -->
    <script src="/static/vendor/flowbite/flowbite.min.js"></script>
    <script src="/static/js/htmx.min.js?v=1.5.0"></script>
    <script>
      htmx.onLoad(function (content) {
        initFlowbite();
      });
    </script>
    <script
      defer
      src="/static/vendor/alpinejs/alpine.min.js"
    ></script>
    {% block additional_head %}{% endblock %}
  </head>

  <body>
    {% if current_page not in ["register", "login"] %} {% include
    "partials/auth_navigation.html" %} {% endif %}
    <!-- Your page content goes here -->
    {% block content %}{% endblock %}

    <!-- Components -->
    <script type="text/javascript" src="/static/js/components.js"></script>

    <!-- Include the hyperscript script -->
    <script src="/static/vendor/hyperscript/hyperscript.min.js"></script>

    {% block additional_scripts %}{% endblock %}
  </body>
</html>
