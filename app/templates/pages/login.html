{% extends "base/auth_base.html" %}
{% block title %}Login | FastAPI HTMX{% endblock %}
{% block content %}
{# Card with form inputs: theme/flowbite/content/components/card.md #}
<div
  id="login-page"
  x-data="login"
  x-init="$watch('showError', (value) => { if (value) { setTimeout(() => { showError = false; }, 3000); } });"
  class="flex justify-center p-6"
>
  <div class="w-full max-w-sm bg-neutral-primary-soft p-6 border border-default rounded-base shadow-xs">
    <h1 class="text-xl font-semibold text-heading mb-6">Admin Dashboard</h1>
    <img
      id="login-logo"
      src="/static/img/logo/undraw_login.png"
      alt="Login Logo"
      class="mx-auto mb-6 max-w-xs rounded-base"
    />
    <div class="mb-4">
      <label for="email" class="block mb-2.5 text-sm font-medium text-heading">Email address</label>
      <input
        type="email"
        id="email"
        name="username"
        class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
        placeholder="john.doe@company.com"
        autocomplete="off"
        x-model="username"
        @input="checkLoginUsername(), allocateCSRFToken('{{csrf_token}}')"
        required
      />
      <p
        id="UsernameError"
        :class="{ 'hidden': !showUsernameError }"
        class="hidden mt-2.5 text-sm text-fg-danger-strong"
      >
        <span class="font-medium">Please enter a valid email address</span>
      </p>
    </div>
    <div class="mb-4">
      <label
        for="password"
        id="password-label"
        :class="{ 'hidden': !showPasswordDiv, 'block': showPasswordDiv }"
        class="hidden mb-2.5 text-sm font-medium text-heading"
        >Password</label
      >
      <input
        type="password"
        id="password"
        name="password"
        x-model="password"
        x-show="showPasswordDiv"
        @keyup.enter="setCookie()"
        :class="{ 'hidden': !showPasswordDiv, 'block': showPasswordDiv }"
        class="hidden bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand w-full px-3 py-2.5 shadow-xs placeholder:text-body"
        autocomplete="new-password"
        placeholder="•••••••••"
        required
      />
    </div>
    <div
      x-show="showError"
      :class="{ 'hidden': !showError }"
      class="hidden p-4 mb-4 text-sm text-fg-danger-strong rounded-base bg-danger-soft"
      role="alert"
    >
      <span x-text="message" class="font-medium"></span>
    </div>
    <a class="block mb-4 text-sm font-medium text-fg-brand hover:underline">Forgot Username/Password</a>
    <button
      type="button"
      id="login-button"
      @click="setCookie"
      :class="{ 'cursor-not-allowed opacity-50': showInputButton }"
      class="text-white bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none w-full mb-3"
    >
      Submit
    </button>
    <button
      type="button"
      id="create-user-button"
      hx-get="{{ url_for('get_register') }}"
      hx-target="#login-page"
      hx-swap="outerHTML"
      hx-push-url="true"
      class="text-body bg-neutral-primary-soft border border-default hover:bg-neutral-secondary-medium hover:text-heading focus:ring-4 focus:ring-neutral-tertiary shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none w-full"
    >
      Register User
    </button>
  </div>
</div>
{% endblock %}
