{% extends "base/auth_base.html" %} {% block title %}Dashboard | FastAPI HTMX{% endblock %}
{% block content %}
<div id="dashboard-body" class="p-4 sm:ml-64 mt-14">
  <div class="p-4 border-1 border-default border-dashed rounded-base">
    <div class="grid grid-cols-3 gap-4 mb-4">
      <div class="flex items-center justify-center h-24 rounded-base bg-neutral-secondary-soft">
          <p class="text-fg-disabled"><svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14m-7 7V5"/></svg></p>
        </div>
      <div class="flex items-center justify-center h-24 rounded-base bg-neutral-secondary-soft">
        <h1 class="text-center text-heading">{{ message }}</h1>
        <h4 id="result" class="text-center"></h4>
      </div>
      <div class="flex items-center justify-center h-24 rounded-base bg-neutral-secondary-soft">
          <p class="text-fg-disabled"><svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14m-7 7V5"/></svg></p>
        </div>
    </div>
    <div class="flex items-center justify-center h-48 mb-4 rounded-base bg-neutral-secondary-soft">
          <p class="text-fg-disabled"><svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14m-7 7V5"/></svg></p>
        </div>
    <div id="upload-result" class="flex items-center justify-center rounded-base bg-neutral-secondary-soft h-auto p-4 mb-4">
      <!-- Upload result will be displayed here -->
    </div>
    <div class="grid grid-cols-2 gap-4 mb-4">
      {% for _ in range(4) %}
        <div class="flex items-center justify-center h-24 rounded-base bg-neutral-secondary-soft">
          <p class="text-fg-disabled"><svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14m-7 7V5"/></svg></p>
        </div>
      {% endfor %}
    </div>
    <div class="flex items-center justify-center h-48 mb-4 rounded-base bg-neutral-secondary-soft">
          <p class="text-fg-disabled"><svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14m-7 7V5"/></svg></p>
        </div>
    <div class="grid grid-cols-2 gap-4">
      {% for _ in range(4) %}
        <div class="flex items-center justify-center h-24 rounded-base bg-neutral-secondary-soft">
          <p class="text-fg-disabled"><svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14m-7 7V5"/></svg></p>
        </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
