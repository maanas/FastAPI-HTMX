{# Fragment, no layout. Root id is the sidebar link's hx-target. #}
{# Form: theme/flowbite/content/forms/input-field.md "Input fields"; alerts.md "Default alert" #}
<div id="dashboard-body" class="p-4 sm:ml-64 mt-14">
  <div class="p-4 border-1 border-default border-dashed rounded-base">
    <h1 class="mb-4 text-xl font-semibold text-heading">Add Group</h1>
    <form
      id="create-group-form"
      hx-target="#dashboard-body"
      hx-post="{{ url_for('post_create_group') }}"
      hx-swap="outerHTML"
      hx-push-url="true"
      hx-headers='{{ {"X-CSRF-Token": (csrf_token or '')} | tojson }}'
    >
      <div class="mb-6">
        <label for="group-type" class="block mb-2.5 text-sm font-medium text-heading">Group Type</label>
        <input
          type="text"
          id="group-type"
          name="group_name"
          placeholder="Enter the group type"
          _="on htmx:validation:validate
                if my.value == ''
                    call me.setCustomValidity('Please enter the Group Type')
                else
                    call me.setCustomValidity('')"
          required
          class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
        />
      </div>
      <div class="mb-6">
        <label for="group-desc" class="block mb-2.5 text-sm font-medium text-heading">Group Description</label>
        <input
          type="text"
          id="group-desc"
          name="group_desc"
          placeholder="Enter the group description."
          required
          class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
        />
      </div>
      {% if error_messages %}
      <div id="error-message" class="p-4 mb-4 text-sm text-fg-warning rounded-base bg-warning-soft" role="alert">
        {% for error in error_messages %}
        <span class="font-medium">{{ error }}</span><br />
        {% endfor %}
      </div>
      {% endif %}
      <button type="submit" class="text-white bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none">Create New Group</button>
    </form>
  </div>
</div>
