{# Fragment, no layout. Root id is the sidebar link's hx-target. #}
{# Form: theme/flowbite/content/forms/input-field.md "Input fields"; alerts.md "Default alert" #}
<div id="dashboard-body" class="p-4 sm:ml-64 mt-14">
  <div class="p-4 border-1 border-default border-dashed rounded-base">
    <h1 class="mb-4 text-xl font-semibold text-heading">Add Role</h1>
    <form
      id="create-role-form"
      x-data="roleForm"
      hx-target="#dashboard-body"
      hx-post="{{ url_for('post_create_roles') }}"
      hx-swap="outerHTML"
      hx-push-url="true"
      hx-headers='{{ {"X-CSRF-Token": (csrf_token or '')} | tojson }}'
    >
      <div class="mb-6">
        <label for="role-type" class="block mb-2.5 text-sm font-medium text-heading">Role Type</label>
        <input
          type="text"
          id="role-type"
          name="role_name"
          x-model="roleName"
          placeholder="Project Manager"
          required
          class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
        />
        <p x-show="roleTypeError" x-text="roleTypeError" class="mt-2.5 text-sm text-fg-danger"></p>
      </div>
      <div class="mb-6">
        <label for="role-desc" class="block mb-2.5 text-sm font-medium text-heading">Role Description</label>
        <input
          type="text"
          id="role-desc"
          name="role_desc"
          x-model="roleDesc"
          placeholder="Project manager is responsible for the planning, execution and closing of any project."
          required
          class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
        />
        <p x-show="roleDescError" x-text="roleDescError" class="mt-2.5 text-sm text-fg-danger"></p>
      </div>
      {% if error_messages %}
      <div id="error-message" class="p-4 mb-4 text-sm text-fg-warning rounded-base bg-warning-soft" role="alert">
        {% for error in error_messages %}
        <span class="font-medium">{{ error }}</span><br />
        {% endfor %}
      </div>
      {% endif %}
      <button type="submit" class="text-white bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none">Create New Role</button>
    </form>
  </div>
</div>
