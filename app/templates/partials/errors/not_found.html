{# Fragment, no layout. Root id is the sidebar link's hx-target; in_shell is true when it is swapped into the shell. #}
{# Button: theme/flowbite/content/components/buttons.md "Default button" #}
<div id="dashboard-body" class="p-4{% if in_shell %} sm:ml-64 mt-14{% endif %}">
  <div class="p-4 border-1 border-default border-dashed rounded-base">
    <h1 class="mb-2 text-xl font-semibold text-heading">Page not found</h1>
    <p class="mb-4 text-body">The page you asked for does not exist.</p>
    <a
      href="{{ path_for('get_dashboard') }}"
      class="inline-block text-white bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none"
    >Back to the dashboard</a>
  </div>
</div>
