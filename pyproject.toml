[project]
name = "fastapi-htmx"
version = "0.1"
description = "Software to manage between geographical spread teams"
authors = [{ name = "Maanas Royy" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.0",
    # fastapi-users-db-sqlalchemy 7 (via fastapi-users 15.0.5) needs sqlalchemy <2.1; 2.1.4 cannot resolve
    "sqlalchemy==2.0.54",
    "uvicorn==0.54.0",
    "aiosqlite==0.22.1",
    "jinja2==3.1.6",
    "httpx==0.28.1",
    "nh3==0.3.7",
    "alembic==1.20.0",
    "pydantic-settings==2.15.0",
    "minio==7.2.20",
    "fastapi-csrf-protect==1.0.7",
    "fastapi-users[sqlalchemy]==15.0.5",
    "prompt-toolkit==3.0.53",
    "pydantic==2.14.1",
    "loguru==0.7.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88

# Assume Python 3.12
target-version = "py312"

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "EM", "ERA", "EXE", "FBT", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "TRY", "UP", "YTT"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10
