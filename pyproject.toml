[project]
name = "fastapi-htmx"
version = "0.1"
description = "Software to manage between geographical spread teams"
authors = [{ name = "Maanas Royy" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.14,<0.116",
    "sqlalchemy>=2.0.41,<3",
    "uvicorn>=0.35.0,<0.36",
    "aiosqlite>=0.19.0,<0.20",
    "jinja2>=3.1.6,<4",
    "httpx>=0.28.1,<0.29",
    "nh3>=0.2.21,<0.3",
    "alembic>=1.16.2,<2",
    "pydantic-settings>=2.2.1,<3",
    "minio>=7.2.7,<8",
    "fastapi-csrf-protect>=1.0.3,<2",
    "fastapi-users[sqlalchemy]>=14.0.1,<15",
    "prompt-toolkit>=3.0.47,<4",
    # 2.12+ breaks app/schema/pydantic_base.py (default plus default_factory), see TODO.md
    "pydantic>=2.11.7,<2.12",
    "loguru>=0.7.2,<0.8",
]

[dependency-groups]
dev = [
    "pytest>=7.4.3,<8",
    "ruff==0.0.291",
]

[tool.uv]
package = false

[tool.ruff]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "EM", "ERA", "EXE", "FBT", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "TRY", "UP", "YTT"]
unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Assume Python 3.12
target-version = "py312"

[tool.ruff.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10